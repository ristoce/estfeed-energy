# Merge price_signals INSIDE your existing estfeed_energy: block, then restart HA.
# Keep your existing credentials, history_start and dated billing tariffs.
# Prices and the cheap threshold are all in EUR/kWh, NOT cents/kWh or EUR/MWh.
estfeed_energy:
  # ...keep your existing settings here...
  price_signals:
    enabled: true
    timezone: Europe/Tallinn
    cheap_price: 0.10       # <= 10 cents/kWh always becomes very_low / low
    history_days: 30        # Previous local days; configurable 1..365
    margin: 0.0            # EUR/kWh; set your electricity margin here if wanted
    multiplier: 1.0        # Example: 1.24 if adding 24% tax to price + margin
    # These are independent of historical billing tariffs. Default is pre-tax spot.
    today_weight: 0.5
    tomorrow_weight: 0.3
    history_weight: 0.2
    level_percentiles: [20, 40, 60, 80]
    low_percentile: 60      # Lowest 60% of the weighted comparison -> low
